services:
  library-primary:
    image: mariadb:10.11
    container_name: library-primary
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-LibraryRoot_ChangeMe!}
      MARIADB_DATABASE: library_db
    ports:
      - "3307:3306"
    volumes:
      - primary_data:/var/lib/mysql
      - ./config/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
      - ./init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init/02-sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
      - ./init/03-replication-user.sql:/docker-entrypoint-initdb.d/03-replication-user.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  library-replica:
    image: mariadb:10.11
    container_name: library-replica
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-LibraryRoot_ChangeMe!}
    ports:
      - "3308:3306"
    volumes:
      - replica_data:/var/lib/mysql
      - ./config/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
    depends_on:
      library-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  primary_data:
  replica_data:
